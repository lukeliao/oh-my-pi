name: Package Windows MSI

# Builds the custom omp Windows MSI: cross-compiles our fork's omp exe
# (CROSS_TARGET=windows-x64), cross-builds semble_rs.exe (mingw), stages
# tools/skills/model directly from this repo (+LFS model), and wraps
# everything via msitools/wixl >= 0.105.

on:
  workflow_dispatch:
    inputs:
      omp-version:
        description: "Version string (e.g. 18.0.10)"
        type: string
        required: true
        default: "18.0.10"
      semble-rs-repo:
        description: "semble_rs source repo (checked out as ../semble_rs sibling)"
        type: string
        required: false
        default: "johunsang/semble_rs"

permissions:
  contents: write
  actions: read

jobs:
  package-msi:
    name: Build custom Windows MSI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # resources/models/**/model.safetensors is LFS-tracked.
          lfs: true
          path: oh-my-pi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ inputs.semble-rs-repo }}
          path: semble_rs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Verify pinned model is materialized (not an LFS pointer)
        run: |
          f=oh-my-pi/resources/models/potion-code-16M-v2/model.safetensors
          if head -c 5 "$f" | grep -q "version"; then
            echo "error: $f is still an LFS pointer — checkout lfs failed" >&2
            exit 1
          fi
          test "$(stat -c%s "$f")" -gt 30000000

      - name: Install toolchain deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64-win32
          rustup target add x86_64-pc-windows-gnu
          # wixl >= 0.105 required for <Environment> support; distro ships 0.103.
          curl -fsSL "https://micro.mamba.pm/api/micromamba/linux-64/latest" | tar -xj -C /tmp bin/micromamba
          MAMBA_ROOT_PREFIX=/tmp/mamba /tmp/bin/micromamba create -y -p /tmp/msitools-env -c conda-forge "msitools=0.106"
          echo "/tmp/msitools-env/bin" >> "$GITHUB_PATH"

      - name: Install JS dependencies
        run: bun --cwd=oh-my-pi install

      - name: Cross-compile omp for Windows
        run: CROSS_TARGET=windows-x64 bun --cwd=oh-my-pi/packages/coding-agent run build

      - name: Stage MSI payload from repo artifacts
        run: |
          PAYLOAD="$GITHUB_WORKSPACE/msi-payload"
          mkdir -p "$PAYLOAD/tools/semble-rs" "$PAYLOAD/models" "$PAYLOAD/skills"
          cp oh-my-pi/.omp/tools/semble-rs/index.ts "$PAYLOAD/tools/semble-rs/"
          for d in oh-my-pi/.omp/skills/*/; do
            cp -R "$d" "$PAYLOAD/skills/$(basename "$d")"
          done
          cp -R oh-my-pi/resources/models/potion-code-16M-v2 "$PAYLOAD/models/potion-code-16M"

      - name: Build MSI
        run: |
          cd oh-my-pi
          bash scripts/ci-build-msi.sh "${{ inputs.omp-version }}" \
            packages/coding-agent/dist/omp-windows-x64.exe \
            "$GITHUB_WORKSPACE/msi-payload" \
            packages/coding-agent/binaries/omp-windows-x64.msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-windows-x64-msi-v${{ inputs.omp-version }}
          path: oh-my-pi/packages/coding-agent/binaries/omp-windows-x64.msi
          retention-days: 90

      - name: Create GitHub Release with MSI
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ inputs.omp-version }}-msi
          name: "OMP v${{ inputs.omp-version }} — Windows MSI Installer (custom)"
          body: |
            ## OMP Coding Agent v${{ inputs.omp-version }} — Windows MSI (custom build)

            Per-user installer for our custom omp distribution: fork binary,
            semble_rs helper, Model2Vec model, xd:// tools, and bundled skills.

            ### Install

            Download `omp-windows-x64.msi` and double-click to install (no admin).

            - `%LOCALAPPDATA%\omp\` — omp.exe, semble_rs.exe, model
            - `%USERPROFILE%\.omp\agent\` — tools + skills
            - User PATH gains `%LOCALAPPDATA%\omp`; `SEMBLE_RS_BIN` / `SEMBLE_MODEL_PATH` set
          files: |
            oh-my-pi/packages/coding-agent/binaries/omp-windows-x64.msi
          generate_release_notes: false
